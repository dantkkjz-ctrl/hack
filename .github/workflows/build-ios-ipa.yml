name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract Project ZIP
        run: |
          set -euo pipefail
          echo "=== Searching and Extracting Project ZIP ==="

          ZIP_PATH=$(find . -not -path './.git/*' -name '*.zip' | head -1 || true)

          if [ -z "$ZIP_PATH" ]; then
            echo "❌ No zip found in repository!"
            ls -la .
            exit 1
          fi

          echo "✅ Found zip: $ZIP_PATH"
          echo "Extracting with ditto..."
          ditto -x -k "$ZIP_PATH" .
          echo "✅ Extraction complete!"

      - name: Build and Package Unsigned IPA
        run: |
          set -euo pipefail

          # Locate Xcode project
          PROJECT_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" -not -path './.git/*' -print -quit || true)

          if [ -z "$PROJECT_PATH" ]; then
            echo "❌ ERROR: ThreeOneOSFive.xcodeproj not found!"
            echo "All files found:"
            find . -maxdepth 5 -not -path './.git/*'
            exit 1
          fi

          TARGET_DIR=$(dirname "$PROJECT_PATH")
          echo "✅ Found Xcode project in: $TARGET_DIR"
          cd "$TARGET_DIR"

          BUILD_DIR="$PWD/build"
          ARCHIVE="$BUILD_DIR/Cryptroic.xcarchive"
          IPA="$BUILD_DIR/Cryptroic-unsigned.ipa"
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"

          echo "=== Building with xcodebuild ==="
          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme Cryptroic \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive

          APP="$ARCHIVE/Products/Applications/Cryptroic.app"

          # Move .3105 patches into app bundle
          if [ -d "$TARGET_DIR/ThreeOneOSFive/Patches" ]; then
            mkdir -p "$APP/Patches"
            cp -R "$TARGET_DIR/ThreeOneOSFive/Patches/"*.3105 "$APP/Patches/" 2>/dev/null || true
            echo "✅ Patches copied into app bundle"
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Cryptroic" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundlePackageType APPL"     "$APP/Info.plist" || true

          echo "=== Packaging IPA ==="
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP" "$BUILD_DIR/Payload/"
          (cd "$BUILD_DIR" && zip -qry "$IPA" Payload && rm -rf Payload)
          test -s "$IPA"
          echo "✅ IPA ready: $IPA"

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cryptroic-ESign-Ready-IPA
          path: "**/build/Cryptroic-unsigned.ipa"
          retention-days: 7
